  <!-- Four engraved cardinal diamonds anchor the kamon-like seal. -->
  <path fill="#fff" d="M250 48l7 7-7 7-7-7 7-7ZM452 250l-7 7-7-7 7-7 7 7ZM250 452l-7-7 7-7 7 7-7 7ZM48 250l7-7 7 7-7 7-7-7Z"/>

  <!-- Art-deco celestial cloud crest: three plumes over layered Japanese mist. -->
  <g fill="#fff" aria-label="stylized cloud crest">
    <path d="M250 93c-31 24-48 60-39 98 7-22 20-43 39-59 19 16 32 37 39 59 9-38-8-74-39-98Z"/>
    <path d="M218 132c-38 4-69 30-79 67 18-16 41-24 65-22 2 23 10 42 26 58 5-39-10-76-12-103Z"/>
    <path d="M282 132c38 4 69 30 79 67-18-16-41-24-65-22-2 23-10 42-26 58-5-39 10-76 12-103Z"/>
    <path d="M250 145l11 32-11 37-11-37 11-32Z"/>

    <path d="M126 220h92c14 0 25 10 25 23 0 13-11 23-25 23h-20c-7 0-12-5-12-11s5-11 12-11h18c3 0 6-2 6-5s-3-5-6-5h-90a9 9 0 0 1 0-18Z"/>
    <path d="M374 220h-92c-14 0-25 10-25 23 0 13 11 23 25 23h20c7 0 12-5 12-11s-5-11-12-11h-18c-3 0-6-2-6-5s3-5 6-5h90a9 9 0 0 0 0-18Z"/>
    <path d="M162 274h176c6 0 11 5 11 11s-5 11-11 11H162c-6 0-11-5-11-11s5-11 11-11Z"/>
    <path d="M196 304h108c6 0 11 5 11 11s-5 11-11 11H196c-6 0-11-5-11-11s5-11 11-11Z"/>
