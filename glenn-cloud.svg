  <path fill="#fff" d="M132 346h236v4H132z"/>
  <path fill="#fff" d="m118 348 8-8 8 8-8 8-8-8Zm248 0 8-8 8 8-8 8-8-8Z"/>

  <!-- A confident wordmark sized for legibility after voxel conversion. -->
  <text x="250" y="403" text-anchor="middle" fill="#fff"
        font-family="Avenir Next, Montserrat, Inter, Arial, sans-serif"
        font-size="53" font-weight="700" letter-spacing="7">GLENN</text>
  <text x="250" y="438" text-anchor="middle" fill="#fff"
