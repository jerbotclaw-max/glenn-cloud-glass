<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">glenn.cloud celestial cloud crest</title>
  <desc id="desc">A bold circular white engraving emblem with an art-deco cloud crest, dense constellation points, and the glenn.cloud wordmark. The background is transparent.</desc>

  <defs>
    <circle id="halo-dot" cx="250" cy="43" r="1.6" fill="#fff"/>
    <circle id="inner-dot" cx="250" cy="75" r="1.9" fill="#fff"/>
  </defs>

